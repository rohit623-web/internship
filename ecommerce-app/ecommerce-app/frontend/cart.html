<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart - ShopEasy</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">🛍️ ShopEasy</a>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="container">
    <h1 class="page-title">Your Cart</h1>
    <div id="cartContainer"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    renderNavLinks();
    renderCart();

    function renderCart() {
      const container = document.getElementById("cartContainer");
      const items = Cart.getItems();

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            Your cart is empty.<br /><br />
            <a href="index.html" class="btn btn-primary">Browse Products</a>
          </div>`;
        return;
      }

      const rows = items.map((item) => `
        <div class="cart-row">
          <img src="${item.image_url || 'https://via.placeholder.com/64'}" alt="${item.name}" />
          <div class="info">
            <strong>${item.name}</strong><br />
            <span style="color:var(--text-light); font-size:0.85rem;">₹${Number(item.price).toFixed(2)} each</span>
          </div>
          <div class="qty-controls">
            <button onclick="changeQty(${item.product_id}, ${item.quantity - 1})">−</button>
            <span>${item.quantity}</span>
            <button onclick="changeQty(${item.product_id}, ${item.quantity + 1})">+</button>
          </div>
          <strong style="width:90px; text-align:right;">₹${(item.price * item.quantity).toFixed(2)}</strong>
          <button class="btn btn-outline" onclick="removeItem(${item.product_id})">Remove</button>
        </div>
      `).join("");

      const total = Cart.getTotal();

      container.innerHTML = `
        ${rows}
        <div class="cart-summary">
          <div class="row"><span>Items</span><span>${Cart.getItemCount()}</span></div>
          <div class="row total-row"><span>Total</span><span>₹${total.toFixed(2)}</span></div>
          <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="goToCheckout()">
            Proceed to Checkout
          </button>
        </div>
      `;
    }

    function changeQty(productId, newQty) {
      Cart.updateQuantity(productId, newQty);
      renderNavLinks();
      renderCart();
    }

    function removeItem(productId) {
      Cart.removeItem(productId);
      renderNavLinks();
      renderCart();
    }

    function goToCheckout() {
      if (!Auth.isLoggedIn()) {
        showToast("Please login to checkout");
        setTimeout(() => (window.location.href = "login.html"), 800);
        return;
      }
      window.location.href = "checkout.html";
    }
  </script>
</body>
</html>
