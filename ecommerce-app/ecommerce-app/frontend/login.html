<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ShopEasy</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">🛍️ ShopEasy</a>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="form-card">
    <h2 class="page-title">Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>
      <div class="form-error" id="formError"></div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Login</button>
    </form>
    <p class="form-footer-text">Don't have an account? <a href="register.html">Register</a></p>
    <p class="form-footer-text" style="font-size:0.8rem;">Admin demo login: admin@example.com / admin123</p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    renderNavLinks();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("formError");
      const btn = document.getElementById("loginBtn");

      errorEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        const result = await AuthAPI.login(email, password);
        Auth.login(result.token, result.user);
        window.location.href = result.user.role === "admin" ? "admin-dashboard.html" : "index.html";
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
